<?xml version="1.0" encoding="UTF-8"?>
<!-- @author ygw -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180" role="img" aria-labelledby="title desc">
  <title id="title">Lean 4 Harness Plugin 架构图</title>
  <desc id="desc">DeepSeek Harness 中 Lean 4 题目规约、常驻验证、Mathlib 缓存与授权构建的整体流程。</desc>
  <metadata>作者：ygw；生成时间：2026-09-08；用途：Lean 4 Harness Plugin 架构说明。</metadata>
  <defs>
    <filter id="paper"><feTurbulence baseFrequency="0.03" numOctaves="2" seed="17" type="fractalNoise" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer><feBlend in="SourceGraphic" in2="faint" mode="multiply"/></filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#56617d" flood-opacity="0.18"/></filter>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M 0 0 L 10 5.5 L 0 11 z" fill="#406f9d"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M 0 0 L 10 5.5 L 0 11 z" fill="#4f8a65"/></marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M 0 0 L 10 5.5 L 0 11 z" fill="#c77a31"/></marker>
    <style>
      .paper { fill:#fffdf8; }
      .frame { fill:#fcfdff; stroke:#4d789f; stroke-width:3; }
      .panel { stroke-width:2.4; filter:url(#softShadow); }
      .outline { fill:none; stroke:#33455f; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { fill:none; stroke:#56677c; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .dash { fill:none; stroke:#65778e; stroke-width:2.2; stroke-dasharray:8 7; stroke-linecap:round; }
      .arrow { fill:none; stroke:#406f9d; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowBlue); }
      .greenArrow { fill:none; stroke:#4f8a65; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowGreen); }
      .orangeArrow { fill:none; stroke:#c77a31; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowOrange); }
      .title { font-family:'Segoe Print','Comic Sans MS','Microsoft YaHei',sans-serif; font-size:38px; font-weight:700; fill:#24334d; }
      .subtitle { font-family:'Segoe Print','Comic Sans MS','Microsoft YaHei',sans-serif; font-size:20px; font-weight:700; fill:#31445e; }
      .label { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:19px; font-weight:700; fill:#293a54; }
      .text { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:16px; fill:#34445c; }
      .small { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:14px; fill:#40516a; }
      .tiny { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:12px; fill:#53627a; }
      .white { fill:#fff; }
      .blue { fill:#eaf5ff; stroke:#4e86b5; }
      .green { fill:#edf8f0; stroke:#5d9b6d; }
      .yellow { fill:#fff5d8; stroke:#c69a32; }
      .purple { fill:#f3eefb; stroke:#8d70b0; }
      .orange { fill:#fff0e4; stroke:#d48747; }
      .gray { fill:#f4f7fa; stroke:#7b8ca1; }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="1920" height="1180" filter="url(#paper)"/>

  <!-- Boot-time composition -->
  <text x="960" y="53" text-anchor="middle" class="title">Lean 4 Harness Plugin · 可验证证明闭环</text>
  <text x="960" y="82" text-anchor="middle" class="text">模型生成代码，但只有 Lean 的诊断结果可以确认“证明通过”</text>

  <g transform="rotate(-1 950 139)">
    <rect x="558" y="105" width="178" height="70" rx="16" class="panel blue"/>
    <text x="647" y="134" text-anchor="middle" class="label">① Web Profile</text>
    <text x="647" y="157" text-anchor="middle" class="small">dsh-base + web-app</text>
    <rect x="787" y="105" width="206" height="70" rx="16" class="panel purple"/>
    <text x="890" y="134" text-anchor="middle" class="label">② Lean Profile Bundle</text>
    <text x="890" y="157" text-anchor="middle" class="small">常驻验证 + 工具守卫</text>
    <rect x="1044" y="105" width="196" height="70" rx="16" class="panel yellow"/>
    <text x="1142" y="134" text-anchor="middle" class="label">③ 本地 Patch 配置</text>
    <text x="1142" y="157" text-anchor="middle" class="small">超时、工作区、预热</text>
  </g>
  <path d="M 739 140 L 782 140" class="arrow"/>
  <path d="M 996 140 L 1039 140" class="arrow"/>
  <path d="M 1142 179 C 1142 202 1080 204 1080 215" class="dash" marker-end="url(#arrowBlue)"/>
  <text x="1218" y="123" class="small">启动时组合</text>

  <!-- Main runtime frame -->
  <rect x="178" y="202" width="1564" height="792" rx="42" class="frame" filter="url(#paper)"/>
  <text x="960" y="245" text-anchor="middle" class="title">DeepSeek Harness + Lean 4 隔离运行环境</text>
  <text x="960" y="271" text-anchor="middle" class="text">Cordis 负责服务注册与生命周期；下面是一次用户请求在该运行环境里的实际路径</text>

  <!-- user -->
  <g transform="rotate(-1 83 541)">
    <circle cx="83" cy="460" r="34" fill="#f4cfaa" stroke="#34455e" stroke-width="2"/>
    <path d="M51 459 q30 -56 65 -5 q-7 -40 -36 -38 q-25 4 -29 43" fill="#454f60"/>
    <circle cx="72" cy="465" r="3" fill="#2e3d55"/><circle cx="94" cy="465" r="3" fill="#2e3d55"/>
    <path d="M75 480 q9 9 18 0" class="thin"/>
    <path d="M45 503 q38 -26 76 0 v78 h-76z" fill="#9eb9d5" stroke="#34455e" stroke-width="2"/>
    <rect x="49" y="521" width="68" height="43" rx="5" fill="#eaf1f8" stroke="#34455e" stroke-width="2"/>
    <path d="M49 566 h68" class="outline"/>
  </g>
  <text x="83" y="617" text-anchor="middle" class="subtitle">用户</text>
  <text x="83" y="640" text-anchor="middle" class="small">题目 / 题图</text>
  <path d="M137 531 C 158 531 169 531 187 531" class="arrow"/>

  <!-- Web entry -->
  <g transform="rotate(0.4 298 530)">
    <rect x="204" y="350" width="190" height="362" rx="22" class="panel blue"/>
    <text x="299" y="385" text-anchor="middle" class="subtitle">Web 交互入口</text>
    <line x1="222" y1="399" x2="376" y2="399" class="thin"/>
    <rect x="223" y="418" width="152" height="58" rx="12" class="white outline"/>
    <text x="252" y="451" class="label">⌂</text><text x="278" y="445" class="label">Web UI</text><text x="278" y="466" class="tiny">127.0.0.1:3080</text>
    <rect x="223" y="491" width="152" height="58" rx="12" class="white outline"/>
    <text x="252" y="524" class="label">✦</text><text x="278" y="519" class="label">标准 Agent</text><text x="278" y="540" class="tiny">模型、上下文与工具</text>
    <rect x="223" y="564" width="152" height="58" rx="12" class="white outline"/>
    <text x="252" y="598" class="label">▣</text><text x="278" y="593" class="label">Skill 目录</text><text x="278" y="613" class="tiny">DSH_HOME/skills</text>
    <rect x="223" y="637" width="152" height="55" rx="12" class="white outline"/>
    <text x="252" y="670" class="label">◎</text><text x="278" y="666" class="label">授权提示</text><text x="278" y="685" class="tiny">由用户最终决定</text>
  </g>
  <path d="M396 531 L 433 531" class="arrow"/>

  <!-- Main agent loop -->
  <g>
    <rect x="432" y="324" width="638" height="420" rx="34" fill="#fbfff8" stroke="#709766" stroke-width="3"/>
    <rect x="628" y="301" width="247" height="48" rx="18" class="panel green"/>
    <text x="752" y="332" text-anchor="middle" class="subtitle">主 Agent 证明循环</text>

    <rect x="479" y="377" width="228" height="76" rx="15" class="panel purple"/>
    <text x="593" y="406" text-anchor="middle" class="label">1. 题目规约 Skill</text>
    <text x="593" y="431" text-anchor="middle" class="small">变量、量词、假设、结论</text>
    <text x="593" y="448" text-anchor="middle" class="tiny">核对题图 / OCR / 端点 / 分数</text>

    <rect x="796" y="377" width="226" height="76" rx="15" class="panel blue"/>
    <text x="909" y="406" text-anchor="middle" class="label">2. 模型生成源码</text>
    <text x="909" y="431" text-anchor="middle" class="small">完整 Lean 4 文件</text>
    <text x="909" y="448" text-anchor="middle" class="tiny">最小精确 Mathlib import</text>

    <rect x="796" y="559" width="226" height="82" rx="15" class="panel yellow"/>
    <text x="909" y="590" text-anchor="middle" class="label">3. 调用 lean_check</text>
    <text x="909" y="616" text-anchor="middle" class="small">提交完整源码与逻辑文件名</text>

    <rect x="479" y="559" width="228" height="82" rx="15" class="panel orange"/>
    <text x="593" y="590" text-anchor="middle" class="label">4. 读取诊断并修正</text>
    <text x="593" y="616" text-anchor="middle" class="small">文件、行、列、错误信息</text>

    <path d="M708 415 L 790 415" class="arrow"/>
    <path d="M909 455 L 909 553" class="arrow"/>
    <path d="M790 600 L 714 600" class="arrow"/>
    <path d="M594 556 C 412 534 429 385 470 414" class="greenArrow"/>
    <text x="449" y="487" class="small">未通过</text>
    <path d="M1026 600 C 1056 600 1076 600 1105 600" class="arrow"/>
  </g>

  <!-- tool / guard layer -->
  <g>
    <rect x="1106" y="324" width="420" height="420" rx="31" class="gray panel"/>
    <text x="1316" y="361" text-anchor="middle" class="subtitle">验证工具与安全控制层</text>
    <rect x="1140" y="383" width="352" height="64" rx="14" class="panel blue"/>
    <text x="1163" y="420" class="label">A. 精确 import 检查</text>
    <text x="1163" y="441" class="tiny">检查每个 import 对应的 .olean 是否已经存在</text>

    <rect x="1140" y="468" width="164" height="112" rx="14" class="panel green"/>
    <text x="1222" y="500" text-anchor="middle" class="label">缓存命中</text>
    <text x="1222" y="524" text-anchor="middle" class="small">直接验证</text>
    <text x="1222" y="550" text-anchor="middle" class="tiny">不下载、不重构</text>

    <rect x="1327" y="468" width="165" height="112" rx="14" class="panel orange"/>
    <text x="1409" y="497" text-anchor="middle" class="label">缓存缺失</text>
    <text x="1409" y="522" text-anchor="middle" class="small">精确 Mathlib.*</text>
    <text x="1409" y="547" text-anchor="middle" class="tiny">请求一次授权</text>

    <rect x="1140" y="610" width="352" height="99" rx="14" class="panel yellow"/>
    <text x="1316" y="641" text-anchor="middle" class="label">最终工具守卫</text>
    <text x="1316" y="667" text-anchor="middle" class="small">禁止模型直接运行 lake build / update / clean / exe</text>
    <text x="1316" y="690" text-anchor="middle" class="small">禁止模型直接修改 D:/mathlib4</text>

    <path d="M1222 450 L 1222 462" class="greenArrow"/>
    <path d="M1409 450 L 1409 462" class="orangeArrow"/>
    <path d="M1408 584 C 1408 598 1377 600 1330 607" class="orangeArrow"/>
    <path d="M1529 600 L 1563 600" class="arrow"/>
  </g>

  <!-- persistent server -->
  <g transform="rotate(-0.3 1642 552)">
    <rect x="1564" y="349" width="150" height="410" rx="24" class="panel purple"/>
    <text x="1639" y="387" text-anchor="middle" class="subtitle">常驻验证</text>
    <text x="1639" y="412" text-anchor="middle" class="subtitle">服务</text>
    <line x1="1581" y1="427" x2="1697" y2="427" class="thin"/>
    <rect x="1582" y="449" width="115" height="83" rx="13" class="white outline"/>
    <text x="1640" y="481" text-anchor="middle" class="label">lean --server</text>
    <text x="1640" y="505" text-anchor="middle" class="tiny">常驻 Lean LSP</text>
    <rect x="1582" y="553" width="115" height="83" rx="13" class="white outline"/>
    <text x="1640" y="584" text-anchor="middle" class="label">Validation.lean</text>
    <text x="1640" y="609" text-anchor="middle" class="tiny">固定内部文档</text>
    <rect x="1582" y="657" width="115" height="77" rx="13" class="white outline"/>
    <text x="1640" y="686" text-anchor="middle" class="label">结构化诊断</text>
    <text x="1640" y="709" text-anchor="middle" class="tiny">行 / 列 / 严重级别</text>
    <path d="M1640 534 L 1640 547" class="arrow"/>
    <path d="M1640 638 L 1640 651" class="arrow"/>
  </g>
  <path d="M1640 764 C 1640 786 1601 798 1537 798" class="arrow"/>

  <!-- environment and results -->
  <g>
    <rect x="280" y="790" width="656" height="158" rx="25" class="panel purple"/>
    <text x="608" y="827" text-anchor="middle" class="subtitle">本地可复现环境（只读复用）</text>
    <rect x="311" y="846" width="180" height="76" rx="13" class="white outline"/>
    <text x="401" y="875" text-anchor="middle" class="label">Lean 工作区</text>
    <text x="401" y="900" text-anchor="middle" class="tiny">D:/lean4-harness-plugin/lean</text>
    <rect x="520" y="846" width="171" height="76" rx="13" class="white outline"/>
    <text x="606" y="875" text-anchor="middle" class="label">Lean 4.26.0</text>
    <text x="606" y="900" text-anchor="middle" class="tiny">锁定 toolchain</text>
    <rect x="720" y="846" width="184" height="76" rx="13" class="white outline"/>
    <text x="812" y="875" text-anchor="middle" class="label">Mathlib .olean</text>
    <text x="812" y="900" text-anchor="middle" class="tiny">本地缓存，按需加载</text>
  </g>
  <path d="M905 884 C 980 884 1035 834 1110 787" class="dash" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="1015" y="790" width="510" height="158" rx="25" class="panel green"/>
    <text x="1270" y="827" text-anchor="middle" class="subtitle">返回给模型与用户的结果</text>
    <rect x="1047" y="846" width="138" height="72" rx="13" class="white outline"/>
    <text x="1116" y="875" text-anchor="middle" class="label">verified</text>
    <text x="1116" y="899" text-anchor="middle" class="tiny">可以声明通过</text>
    <rect x="1201" y="846" width="138" height="72" rx="13" class="white outline"/>
    <text x="1270" y="875" text-anchor="middle" class="label">invalid</text>
    <text x="1270" y="899" text-anchor="middle" class="tiny">诊断后再修正</text>
    <rect x="1355" y="846" width="138" height="72" rx="13" class="white outline"/>
    <text x="1424" y="872" text-anchor="middle" class="small">授权 / 配置</text>
    <text x="1424" y="899" text-anchor="middle" class="tiny">如实报告阻塞</text>
  </g>
  <path d="M1011 884 C 977 884 954 884 941 884" class="arrow"/>

  <!-- future extension -->
  <g>
    <rect x="405" y="1019" width="1110" height="110" rx="22" fill="#faf7ff" stroke="#9c82bd" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="470" y="1060" class="subtitle">未来扩展（尚未接入）</text>
    <rect x="706" y="1039" width="190" height="63" rx="13" class="panel purple"/>
    <text x="801" y="1067" text-anchor="middle" class="label">LeanCopilot 适配器</text>
    <text x="801" y="1089" text-anchor="middle" class="tiny">只产生候选建议</text>
    <rect x="1044" y="1039" width="208" height="63" rx="13" class="panel blue"/>
    <text x="1148" y="1067" text-anchor="middle" class="label">逐项隔离复验</text>
    <text x="1148" y="1089" text-anchor="middle" class="tiny">候选必须再经 lean_check</text>
    <path d="M902 1070 L 1037 1070" class="dash" marker-end="url(#arrowBlue)"/>
    <text x="1296" y="1068" class="small">通过后才可标记</text>
    <text x="1296" y="1092" class="small">suggestion_verified</text>
  </g>

  <!-- legend -->
  <g transform="rotate(-1 1602 1011)">
    <text x="1578" y="1019" class="subtitle">图例</text>
    <rect x="1578" y="1034" width="18" height="18" rx="4" class="blue"/><text x="1604" y="1049" class="tiny">正常工具 / 服务</text>
    <rect x="1578" y="1062" width="18" height="18" rx="4" class="green"/><text x="1604" y="1077" class="tiny">验证成功或缓存路径</text>
    <rect x="1578" y="1090" width="18" height="18" rx="4" class="orange"/><text x="1604" y="1105" class="tiny">授权或受控动作</text>
  </g>
</svg>
